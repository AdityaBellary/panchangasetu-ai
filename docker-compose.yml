# Local stack: Postgres, Qdrant and the PanchangaSetu API + web chat.
#   docker compose up -d postgres qdrant     # dev: run the app from the venv
#   docker compose up -d --build api         # or run the app in a container too (http://127.0.0.1:8000)
#   docker compose --profile monitoring up -d  # Prometheus (127.0.0.1:9090) + Grafana (127.0.0.1:3000)
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: psetu
      POSTGRES_PASSWORD: psetu  # dev only; production uses a secrets manager
      POSTGRES_DB: psetu
    ports:
      - "127.0.0.1:${PSETU_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psetu -d psetu"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0  # keep in step with qdrant-client (major.minor)
    ports:
      - "127.0.0.1:${PSETU_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: panchangasetu:local
    env_file: .env  # SARVAM_API_KEY / OPENAI_API_KEY and any PSETU_* overrides
    environment:
      PSETU_DATABASE_URL: postgresql+psycopg://psetu:psetu@postgres:5432/psetu
      PSETU_QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:${PSETU_API_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data  # PDFs, page images, OCR cache, embedding models (data/models)
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # --- monitoring (optional profile). Set PSETU_API_METRICS_TOKEN in .env: Prometheus sends it.
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    ports:
      - "127.0.0.1:${PSETU_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${PSETU_GRAFANA_ADMIN_PASSWORD:-admin}  # change on first login
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${PSETU_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

configs:
  metrics_token:
    content: "${PSETU_API_METRICS_TOKEN:-}"

volumes:
  pgdata:
  qdrantdata:
  promdata:
  grafanadata:
