# Local development stack. Redis, API and worker services are added in later phases.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: psetu
      POSTGRES_PASSWORD: psetu  # dev only; production uses a secrets manager
      POSTGRES_DB: psetu
    ports:
      - "127.0.0.1:${PSETU_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psetu -d psetu"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0  # keep in step with qdrant-client (major.minor)
    ports:
      - "127.0.0.1:${PSETU_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  qdrantdata:
