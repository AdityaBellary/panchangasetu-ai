[project]
name = "panchangasetu"
version = "0.1.0"
description = "PanchangaSetu AI - Telugu document intelligence and grounded RAG platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "sarvamai>=0.1.43",
    "tenacity>=9.0",
    "regex>=2024.11",
    "pyyaml>=6.0",
    "qdrant-client>=1.20,<1.21",
    "fastembed>=0.9.1",
    "numpy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
]

[project.scripts]
psetu = "panchangasetu.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-regex",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panchangasetu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs external services (Postgres, Tesseract)",
    "sarvam: calls the real Sarvam API (costs credits)",
]
addopts = "-m 'not sarvam'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Telugu text in strings/comments is intentional
    "SIM905",  # """word list""".split() is more readable than long list literals
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF ships no type information; treat it as Any instead of flagging every call.
module = ["pymupdf", "pymupdf.*", "sarvamai", "sarvamai.*"]
follow_imports = "skip"
