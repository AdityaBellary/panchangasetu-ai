# Scrapes the PanchangaSetu API. Two targets cover both setups: the API in compose ("api") and the API
# running on the host (`psetu serve --host 0.0.0.0`). Whichever isn't running shows as down.
# /metrics only answers non-loopback scrapers that send PSETU_API_METRICS_TOKEN (mounted below).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: panchangasetu
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000"]
