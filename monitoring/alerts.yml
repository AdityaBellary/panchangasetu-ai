# Alert rules (visible under Alerts in Prometheus and Grafana). Wire an Alertmanager or Grafana contact
# point to get notified; thresholds are starting points.
groups:
  - name: panchangasetu
    rules:
      - alert: ApiDown
        expr: max(up{job="panchangasetu"}) == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "PanchangaSetu API is not reachable"}
      - alert: ServerErrors
        expr: sum(rate(psetu_http_requests_total{status=~"5.."}[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "API is returning 5xx errors"}
      - alert: LlmBudgetNearlyUsed
        expr: max(psetu_llm_budget_inr) > 0 and max(psetu_llm_spent_today_inr) / max(psetu_llm_budget_inr) > 0.8
        labels: {severity: warning}
        annotations: {summary: "Over 80% of today's LLM budget is spent"}
      - alert: LlmCallsFailing
        expr: sum(rate(psetu_llm_calls_total{status!="ok"}[10m])) / clamp_min(sum(rate(psetu_llm_calls_total[10m])), 1e-9) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "More than 20% of LLM calls are failing (credits, outage or rate limits)"}
      - alert: SlowAnswers
        expr: histogram_quantile(0.95, sum by (le) (rate(psetu_stage_seconds_bucket{stage="total"}[15m]))) > 8
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "95% of answers take longer than 8 s"}
      - alert: RefusalsRising
        expr: sum(rate(psetu_answers_total{method="abstain"}[1h])) / clamp_min(sum(rate(psetu_answers_total[1h])), 1e-9) > 0.5
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "More than half of questions are being refused"}
