<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How PanchangaSetu works</title>
  <desc id="d">PDFs are read once into Postgres tables and a Qdrant index. Each question is routed to a table lookup, which answers directly, or a passage search, whose AI-written answer is checked against the cited pages before it is shown.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5584"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93b8"/>
    </marker>
    <style>
      .band { stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #c3cae6; stroke-width: 1.5; }
      .h { font-size: 19px; font-weight: 600; fill: #1c2552; }
      .s { font-size: 15.5px; fill: #5b6488; }
      .title { font-size: 22px; font-weight: 700; fill: #1c2552; }
      .sub { font-size: 17px; fill: #6b7396; }
      .lbl { font-size: 15px; fill: #4a5584; font-style: italic; }
      .flow { stroke: #4a5584; stroke-width: 2; fill: none; marker-end: url(#a); }
      .data { stroke: #8a93b8; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#ad); }
    </style>
  </defs>

  <rect width="1200" height="940" rx="18" fill="#ffffff"/>

  <!-- 1 · Ingest -->
  <rect class="band" x="20" y="20" width="1160" height="232" rx="16" fill="#eef1fb" stroke="#d6dcf1"/>
  <text x="44" y="56"><tspan class="title">1 · Ingest</tspan><tspan class="sub" dx="10">once per PDF</tspan></text>

  <rect class="box" x="44" y="110" width="200" height="76" rx="10"/>
  <text x="144" y="142" text-anchor="middle" class="h">TTD PDFs</text>
  <text x="144" y="166" text-anchor="middle" class="s">data/raw/</text>

  <rect class="box" x="304" y="110" width="250" height="76" rx="10"/>
  <text x="429" y="142" text-anchor="middle" class="h">OCR</text>
  <text x="429" y="166" text-anchor="middle" class="s">Sarvam Vision + Tesseract</text>

  <rect class="box" x="620" y="78" width="250" height="66" rx="10"/>
  <text x="745" y="106" text-anchor="middle" class="h">Pages → chunks</text>
  <text x="745" y="128" text-anchor="middle" class="s">sections of book prose</text>

  <rect class="box" x="620" y="162" width="250" height="66" rx="10"/>
  <text x="745" y="190" text-anchor="middle" class="h">Daily + festival tables</text>
  <text x="745" y="212" text-anchor="middle" class="s">one row per date</text>

  <rect class="box" x="920" y="78" width="236" height="66" rx="10"/>
  <text x="1038" y="106" text-anchor="middle" class="h">Embeddings</text>
  <text x="1038" y="128" text-anchor="middle" class="s">multilingual-e5, local</text>

  <path class="flow" d="M244 148 H302"/>
  <path class="flow" d="M554 148 H586 V111 H618"/>
  <path class="flow" d="M586 148 V195 H618"/>
  <path class="flow" d="M870 111 H918"/>

  <!-- Storage -->
  <rect class="band" x="20" y="272" width="1160" height="168" rx="16" fill="#f5f6f9" stroke="#e1e4ec"/>
  <text x="44" y="308" class="title">Storage</text>

  <g>
    <path d="M635 312 V398 A110 16 0 0 0 855 398 V312" fill="#ffffff" stroke="#c3cae6" stroke-width="1.5"/>
    <ellipse cx="745" cy="312" rx="110" ry="16" fill="#e8ecfa" stroke="#c3cae6" stroke-width="1.5"/>
    <text x="745" y="358" text-anchor="middle" class="h">Postgres</text>
    <text x="745" y="382" text-anchor="middle" class="s">days, festivals, chats, LLM calls</text>
  </g>
  <g>
    <path d="M928 312 V398 A110 16 0 0 0 1148 398 V312" fill="#ffffff" stroke="#c3cae6" stroke-width="1.5"/>
    <ellipse cx="1038" cy="312" rx="110" ry="16" fill="#e8ecfa" stroke="#c3cae6" stroke-width="1.5"/>
    <text x="1038" y="358" text-anchor="middle" class="h">Qdrant</text>
    <text x="1038" y="382" text-anchor="middle" class="s">book passages</text>
  </g>

  <path class="flow" d="M745 228 V294"/>
  <path class="flow" d="M1038 144 V294"/>

  <!-- 2 · Answer a question -->
  <rect class="band" x="20" y="460" width="1160" height="460" rx="16" fill="#eef7f6" stroke="#d3e8e5"/>
  <text x="44" y="496"><tspan class="title">2 · Answer a question</tspan><tspan class="sub" dx="10">every time</tspan></text>

  <rect class="box" x="44" y="560" width="200" height="76" rx="10"/>
  <text x="144" y="592" text-anchor="middle" class="h">Question</text>
  <text x="144" y="616" text-anchor="middle" class="s">Telugu or English</text>

  <rect class="box" x="304" y="560" width="230" height="76" rx="10"/>
  <text x="419" y="592" text-anchor="middle" class="h">Router</text>
  <text x="419" y="616" text-anchor="middle" class="s">dates · tithis · topics</text>

  <rect class="box" x="620" y="520" width="250" height="70" rx="10"/>
  <text x="745" y="550" text-anchor="middle" class="h">Table lookup</text>
  <text x="745" y="573" text-anchor="middle" class="s">exact rows for the date</text>

  <rect x="920" y="520" width="236" height="70" rx="10" fill="#e9f6ef" stroke="#1a7f4b" stroke-width="1.5"/>
  <text x="1038" y="550" text-anchor="middle" class="h">Template answer</text>
  <text x="1038" y="573" text-anchor="middle" class="s">free, under half a second</text>

  <rect class="box" x="620" y="660" width="250" height="70" rx="10"/>
  <text x="745" y="690" text-anchor="middle" class="h">Search passages</text>
  <text x="745" y="713" text-anchor="middle" class="s">meaning + Telugu keywords</text>

  <rect class="box" x="920" y="660" width="236" height="70" rx="10"/>
  <text x="1038" y="690" text-anchor="middle" class="h">AI writes the answer</text>
  <text x="1038" y="713" text-anchor="middle" class="s">Sarvam · Gemini if needed</text>

  <rect class="box" x="920" y="790" width="236" height="90" rx="10"/>
  <text x="1038" y="820" text-anchor="middle" class="h">Checker</text>
  <text x="1038" y="844" text-anchor="middle" class="s">every date, time and quote</text>
  <text x="1038" y="864" text-anchor="middle" class="s">is in the cited pages</text>

  <rect x="580" y="772" width="250" height="56" rx="10" fill="#e9f6ef" stroke="#1a7f4b" stroke-width="1.5"/>
  <text x="705" y="806" text-anchor="middle" class="h">Answer + page links</text>

  <rect x="580" y="846" width="250" height="56" rx="10" fill="#fff4e3" stroke="#c2771a" stroke-width="1.5"/>
  <text x="705" y="870" text-anchor="middle" class="h">Polite refusal</text>
  <text x="705" y="891" text-anchor="middle" class="s">+ that day's panchangam</text>

  <path class="flow" d="M244 598 H302"/>
  <path class="flow" d="M534 598 H570 V555 H618"/>
  <path class="flow" d="M570 598 V695 H618"/>
  <text x="562" y="580" text-anchor="end" class="lbl">calendar</text>
  <text x="562" y="660" text-anchor="end" class="lbl">anything else</text>
  <path class="flow" d="M870 555 H918"/>
  <path class="flow" d="M870 695 H918"/>
  <path class="flow" d="M1038 730 V788"/>
  <path class="flow" d="M920 806 H832"/>
  <path class="flow" d="M920 860 H876 V874 H832"/>
  <text x="875" y="798" text-anchor="middle" class="lbl">passes</text>
  <text x="855" y="896" text-anchor="middle" class="lbl">fails</text>

  <!-- data reads -->
  <path class="data" d="M745 414 V518"/>
  <path class="data" d="M1038 414 V472 H895 V640 H745 V658"/>
  <text x="755" y="470" class="lbl">read</text>
  <text x="905" y="500" class="lbl">search</text>
</svg>
