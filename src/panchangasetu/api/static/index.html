<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PanchangaSetu</title>
  <link rel="icon" href="moon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <!-- Key gate: shown until a working API key is saved in this browser -->
  <section class="gate" id="gate" hidden>
    <form class="gate-card" id="gate-form" autocomplete="off">
      <div class="wordmark">
        <span class="wordmark-te" lang="te">పంచాంగ సేతు</span>
        <span class="wordmark-en">PanchangaSetu</span>
      </div>
      <p class="gate-lede">Answers from the TTD Parabhava panchangam, with the page each one comes from.</p>
      <label for="gate-key">API key</label>
      <input id="gate-key" name="key" type="password" spellcheck="false" placeholder="psk_…" required>
      <p class="gate-help">No key yet? Create one on the server with <code>uv run psetu api-keys create web</code>.
        It stays in this browser only.</p>
      <p class="gate-error" id="gate-error" role="alert" hidden></p>
      <button type="submit" class="btn-primary">Continue</button>
    </form>
  </section>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="wordmark wordmark-small">
        <span class="wordmark-te" lang="te">పంచాంగ సేతు</span>
        <span class="wordmark-en">PanchangaSetu</span>
      </div>
      <button class="btn-new" id="new-chat" type="button">New conversation</button>
      <nav class="history" id="history" aria-label="Past conversations"></nav>
      <button class="btn-quiet" id="sign-out" type="button">Forget API key</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn-menu" id="menu" type="button" aria-label="Show conversations" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="today-pill" id="today-pill" hidden></div>
      </header>

      <div class="scroll" id="scroll">
        <section class="welcome" id="welcome">
          <div class="today" id="today"></div>
          <div class="starters">
            <p class="starters-label">Try asking</p>
            <ul class="starter-list" id="starters"></ul>
          </div>
        </section>
        <ol class="thread" id="thread" aria-live="polite"></ol>
      </div>

      <form class="composer" id="composer">
        <label class="sr-only" for="question">Your question</label>
        <textarea id="question" rows="1" maxlength="500"
          placeholder="Ask in Telugu or English"></textarea>
        <span class="counter" id="counter" hidden></span>
        <button type="submit" class="btn-ask" id="ask">Ask</button>
      </form>
    </main>

    <aside class="drawer" id="drawer" aria-label="Source" hidden>
      <header class="drawer-head">
        <div>
          <p class="drawer-doc" id="drawer-doc"></p>
          <p class="drawer-meta" id="drawer-meta"></p>
        </div>
        <button class="btn-close" id="drawer-close" type="button" aria-label="Close source">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="drawer-body">
        <div class="quotes" id="drawer-quotes"></div>
        <div class="pages" id="drawer-pages"></div>
      </div>
    </aside>
  </div>
</body>
</html>
