# Deploy main to the Hugging Face Space after CI passes on it (or on demand from the Actions tab).
# Only pushes to main deploy: CI runs for pull requests, including ones from forks, never trigger this.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-huggingface
  cancel-in-progress: false

jobs:
  space:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: huggingface
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Upload to the Space and wait for it to come up
        run: uv run --no-project --with huggingface_hub==1.33.0 python deploy/huggingface/deploy_space.py
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          PAGES_DATASET: ${{ vars.PAGES_DATASET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PAGES_READ_TOKEN: ${{ secrets.HF_PAGES_READ_TOKEN }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          PSETU_API_METRICS_TOKEN: ${{ secrets.PSETU_API_METRICS_TOKEN }}
